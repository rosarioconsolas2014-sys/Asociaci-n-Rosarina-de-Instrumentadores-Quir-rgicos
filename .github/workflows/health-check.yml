name: ARIQ - Monitoreo Periódico de Salud

on:
  schedule:
    # Verificación programada cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  health_check:
    name: Comprobación de Producción
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Verificación de Salud de Rutas y Servicios
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://ariq-rosario.firebaseapp.com' }}
        run: |
          node scripts/health-check.mjs

      - name: Notificar Incidente en Caso de Fallo
        if: failure()
        run: |
          echo "::error title=Incidente de Producción::Se detectó una interrupción en el monitoreo de ARIQ."
